services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: sales-points-api-php
    container_name: sales-points-app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sales-points-network

  nginx:
    image: nginx:1.27-alpine
    container_name: sales-points-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sales-points-network

  mysql:
    image: mysql:8.4
    container_name: sales-points-mysql
    environment:
      MYSQL_DATABASE: sales_points
      MYSQL_USER: sales_points
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sales-points-network

  redis:
    image: redis:7-alpine
    container_name: sales-points-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sales-points-network

  queue:
    image: sales-points-api-php
    container_name: sales-points-queue
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=1200
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sales-points-network
  scheduler:
    image: sales-points-api-php
    container_name: sales-points-scheduler
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /var/www/html
    command: php artisan schedule:work
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sales-points-network

volumes:
  mysql-data:
  redis-data:

networks:
  sales-points-network:
    driver: bridge